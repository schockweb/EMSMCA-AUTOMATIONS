# ═══════════════════════════════════════════════════════════
# EMS Claims Portal — App Server Compose
# ═══════════════════════════════════════════════════════════
# Deploys to: Azure VM (ems-portal-vm)
# Services:  FastAPI backend, Nginx reverse proxy + SPA, Certbot
#
# Database: Azure Database for PostgreSQL (Flexible Server)
# RabbitMQ + Workers: docker-compose.worker.yml (same VM)
#
# Usage:
#   docker compose -f docker-compose.prod.yml up -d --build
#   docker compose -f docker-compose.prod.yml logs -f
# ═══════════════════════════════════════════════════════════

# Cap container logs. Docker's json-file driver is unbounded by default:
# a crash-looping container (ems_flower did 2659 restarts) or an exception
# storm can fill the disk in hours, which breaks everything at once.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "5"

services:
  # ── Redis — rate limiting + response cache ───────────────
  # Backs the login rate limiter (shared sliding-window counters across
  # gunicorn workers) and the response cache. Dev has had this all along;
  # without it both features silently fail open. No ports exposed.
  redis:
    logging: *default-logging
    image: redis:7.2-alpine
    container_name: ems_redis
    restart: unless-stopped
    # NO --requirepass yet, deliberately, and this is a TODO not an omission.
    # Turning it on requires REDIS_URL in .env.prod to carry the same password in
    # the SAME change, or the backend cannot authenticate and every request loses
    # its cache and its rate limiter. That file is not in the repository, so it
    # cannot be done atomically from here.
    # Lower urgency than it looks: this Redis publishes no port (reachable only
    # inside ems_app_net) and runs with `--save ""`, so unlike the development
    # instance there is no append-only file on disk. Cached patient records are
    # encrypted before they are written now (app/cache.py), so a memory dump of
    # this container no longer yields plaintext identifiers.
    # To enable: set REDIS_PASSWORD in .env.prod, change REDIS_URL to
    # redis://:<password>@redis:6379/0, add --requirepass ${REDIS_PASSWORD} to the
    # command below, then recreate the redis and backend containers together.
    #
    # (These are YAML comments and MUST stay OUTSIDE the folded `command: >`
    # block — inside it, `#` is literal text and becomes part of the command,
    # which is exactly how this broke a build on 2026-08-03.)
    command: >
      redis-server
      --maxmemory 128mb
      --maxmemory-policy allkeys-lru
      --save ""
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 192M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - ems_app_net

  # ── FastAPI Backend ──────────────────────────────────────
  # Gunicorn + Uvicorn workers.
  # No ports exposed — Nginx reverse-proxies to this container.
  ems_backend:
    logging: *default-logging
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: ems_backend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
    env_file:
      - .env.prod
    volumes:
      - upload_data:/app/uploads       # Persistent file uploads
      - backend_logs:/app/logs         # Application logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3
    networks:
      - ems_app_net
      - ems_shared_net
      - ems_db_net

  # ── Nginx Reverse Proxy + Static Frontend ───────────────
  # Serves the React SPA (built into the image) and proxies
  # /api/* requests to the backend container.
  # Ports 80 and 443 are exposed to the host for HTTP/HTTPS.
  # SSL certificates are managed by Certbot (see below).
  ems_nginx:
    logging: *default-logging
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_API_URL: /api
        VITE_GOOGLE_MAPS_KEY: ${VITE_GOOGLE_MAPS_KEY}
    container_name: ems_nginx
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Unified Nginx config — overrides the baked-in default.conf from
      # the frontend Dockerfile so there's exactly ONE server block.
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # Security headers snippet — loaded via 'include' from the server
      # block, NOT placed in conf.d/ (which Nginx auto-loads as top-level).
      - ./nginx/security-headers.conf:/etc/nginx/snippets/security-headers.conf:ro
      # SSL certificates (managed by Certbot)
      - certbot_certs:/etc/letsencrypt:ro
      - certbot_webroot:/var/www/certbot:ro
    depends_on:
      ems_backend:
        condition: service_healthy
    networks:
      - ems_app_net

  # ── Certbot — Automated SSL Certificate Management ─────
  # Obtains and renews Let's Encrypt certificates.
  # Initial setup:
  #   docker compose -f docker-compose.prod.yml run --rm ems_certbot \
  #     certonly --webroot -w /var/www/certbot \
  #     -d app.example.co.za --agree-tos -m admin@example.co.za
  #
  # Auto-renewal: the entrypoint runs 'certbot renew' every 12h.
  ems_certbot:
    logging: *default-logging
    image: certbot/certbot:latest
    container_name: ems_certbot
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
    volumes:
      - certbot_certs:/etc/letsencrypt
      - certbot_webroot:/var/www/certbot
    # Check for renewal every 12 hours (standard practice)
    entrypoint: /bin/sh -c 'trap exit TERM; while :; do certbot renew --quiet; sleep 43200; done'
    networks:
      - ems_app_net

# ── Volumes ───────────────────────────────────────────────
volumes:
  upload_data:
    driver: local
  backend_logs:
    driver: local
  certbot_certs:
    driver: local
  certbot_webroot:
    driver: local

# ── Networks ──────────────────────────────────────────────
# ems_app_net:    Internal bridge for Nginx ↔ Backend.
# ems_shared_net: Shared with docker-compose.worker.yml so the
#                 backend can reach RabbitMQ directly by container
#                 name instead of relying on the docker0 bridge IP.
networks:
  ems_app_net:
    driver: bridge
  ems_shared_net:
    name: ems_shared_net
    driver: bridge
  ems_db_net:
    external: true
    name: ems_db_net
