# ═══════════════════════════════════════════════════════════
# Nginx — Unified Reverse Proxy + SPA Server
# Mounted into ems_nginx at /etc/nginx/conf.d/default.conf
# ═══════════════════════════════════════════════════════════
# This single config file does everything:
#   1. Serves the React SPA static files (built into the image)
#   2. Proxies /api/* and /docs to the FastAPI backend
#   3. Handles Certbot ACME challenges for SSL
#
# The frontend Dockerfile.prod bakes in its own default.conf,
# but docker-compose.prod.yml volume-mounts THIS file over it.
# ═══════════════════════════════════════════════════════════

upstream ems_api {
    server ems_backend:8000;
}

server {
    listen 80;
    # Accept traffic by IP (initial deploy) and domain (after DNS)
    server_name portal.emsmca.co.za 172.209.218.22 _;

    root /usr/share/nginx/html;
    index index.html;

    # ── Security Headers ──────────────────────────────────
    include /etc/nginx/snippets/security-headers.conf;

    # ── Certbot ACME challenge (for SSL certificate issuance) ──
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # ── API routes → FastAPI Backend ──────────────────────
    location /api/ {
        proxy_pass http://ems_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts for long OCR/adjudication operations
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;

        # File upload limit (PRF scans)
        client_max_body_size 50M;
    }

    # ── Swagger docs → Backend ────────────────────────────
    location /docs {
        proxy_pass http://ems_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /openapi.json {
        proxy_pass http://ems_api;
    }

    # ── Health check → Backend ────────────────────────────
    location /health {
        proxy_pass http://ems_api;
    }

    # ── SPA fallback (React Router) ───────────────────────
    # Serve static files first; if not found, fall back to
    # index.html so client-side routing works.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Static asset caching ──────────────────────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?|ttf|eot)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    # ── Gzip ──────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain text/css
        application/json application/javascript
        text/xml application/xml
        image/svg+xml;
}

