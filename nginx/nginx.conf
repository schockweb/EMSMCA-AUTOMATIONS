# ═══════════════════════════════════════════════════════════
# Nginx — Unified Reverse Proxy + SPA Server
# Mounted into ems_nginx at /etc/nginx/conf.d/default.conf
# ═══════════════════════════════════════════════════════════
# This single config file does everything:
#   1. Serves the React SPA static files (built into the image)
#   2. Proxies /api/* and /docs to the FastAPI backend
#   3. Handles Certbot ACME challenges for SSL
#
# The frontend Dockerfile.prod bakes in its own default.conf,
# but docker-compose.prod.yml volume-mounts THIS file over it.
# ═══════════════════════════════════════════════════════════

limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;

upstream ems_api {
    server ems_backend:8000;
}

server {
    listen 80;
    server_name portal.emsmca.co.za 172.209.218.22 _;

    # ── Certbot ACME challenge (for SSL certificate issuance) ──
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all HTTP traffic to HTTPS (except ACME challenge)
    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS server (uncomment after SSL certificate is issued) ──
# Steps to enable:
#   1. Point portal.emsmca.co.za DNS to 172.209.218.22
#   2. Run: docker compose -f docker-compose.prod.yml run --rm ems_certbot \
#        certonly --webroot -w /var/www/certbot \
#        -d portal.emsmca.co.za --agree-tos -m admin@emsmca.co.za
#   3. Uncomment the block below
#   4. Uncomment the HTTP→HTTPS redirect above (replace the server block's content)
#   5. Restart: docker compose -f docker-compose.prod.yml restart ems_nginx
#
server {
    listen 443 ssl http2;
    server_name portal.emsmca.co.za;

    ssl_certificate /etc/letsencrypt/live/portal.emsmca.co.za/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/portal.emsmca.co.za/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/snippets/security-headers.conf;

    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://ems_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
        client_max_body_size 50M;
    }
    
    location /api/auth/login {
        limit_req zone=auth_limit burst=5 nodelay;
        proxy_pass http://ems_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /docs {
        # Deny all external access to Swagger docs in production
        deny all;
    }

    location /openapi.json {
        deny all;
    }

    location /health {
        proxy_pass http://ems_api;
    }

    # ── Uploaded files (provider logos, etc.) ──
    # The backend writes logos to its upload volume and serves them via its
    # StaticFiles("/uploads") mount; nginx has no access to that volume, so we
    # proxy through. `^~` is REQUIRED: without it the ".png/.jpg/..." regex
    # location below matches first and serves from the frontend static root,
    # which 404s and shows a broken logo image.
    location ^~ /uploads/ {
        proxy_pass http://ems_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
        expires 30d;
        add_header Cache-Control "public";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?|ttf|eot)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain text/css
        application/json application/javascript
        text/xml application/xml
        image/svg+xml;
}
