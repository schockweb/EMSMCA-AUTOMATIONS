# ═══════════════════════════════════════════════════════════
# Nginx — Unified Reverse Proxy + SPA Server  (TEMPLATE)
# ═══════════════════════════════════════════════════════════
# DO NOT mount this file directly. It is the source for nginx/nginx.conf,
# which docker-compose.prod.yml mounts at /etc/nginx/conf.d/default.conf.
#
# Every deployment-specific value below is a ${PLACEHOLDER}. Render it with:
#
#     PORTAL_DOMAIN=portal.client.co.za \
#     PORTAL_HOST_IP=203.0.113.10 \
#     bash deploy/scripts/render-nginx.sh
#
# WHY: nginx/nginx.conf hardcoded portal.emsmca.co.za in server_name AND in
# both ssl_certificate paths. On any other VM nginx starts, fails to find
# /etc/letsencrypt/live/portal.emsmca.co.za/fullchain.pem, and exits — so the
# whole site is down and the cause is buried in a container log. Installing on a
# client's own domain must not require hand-editing a config file.
# ═══════════════════════════════════════════════════════════

limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

# auth_limit was 5r/m per IP, and that was the hard wall in front of every
# sign-in. Measured 2026-08-03: 200 crew authenticating from one address, 75%
# rejected. An ambulance base shares one station WiFi and SA mobile carriers put
# many subscribers behind one CGNAT address, so an entire shift change can arrive
# as a single $binary_remote_addr — and be locked out of starting work.
#
# nginx cannot see whether a sign-in SUCCEEDED, so a limiter here can only ever
# count attempts, which is precisely the measure that cannot tell a shift change
# from a password spray. That distinction now lives in the application, which can
# see the response: 15 FAILED attempts per minute per IP, plus the pre-existing
# per-account lockout of 5 failures for 45 minutes. Those are the credential
# controls, and neither is relaxed by this change.
#
# What is left for nginx is a coarse flood guard — enough headroom for a base to
# sign on, low enough that a single address cannot saturate the auth path. The
# burst absorbs the shift-change spike; the rate covers the tail.
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=100r/m;
# Crash reporting is unauthenticated and one client fault can fire it in a loop
# — the general api_limit above still permits ~864k rows/day from a single IP.
# The app-level limiter is not a backstop either: it fails OPEN when Redis is
# unavailable, which is exactly when crashes spike. 1r/s with a small burst is
# far more than genuine reporting needs.
limit_req_zone $binary_remote_addr zone=crash_limit:10m rate=1r/s;

upstream ems_api {
    server ems_backend:8000;
}

server {
    listen 80;
    server_name portal.emsmca.co.za _;

    # ── Certbot ACME challenge (for SSL certificate issuance) ──
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all HTTP traffic to HTTPS (except ACME challenge)
    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS server ──
# Certificate must exist before nginx will start. Issue it first:
#   docker compose -f docker-compose.prod.yml run --rm ems_certbot \
#     certonly --webroot -w /var/www/certbot \
#     -d portal.emsmca.co.za --agree-tos -m admin@emsmca.co.za
server {
    listen 443 ssl http2;
    server_name portal.emsmca.co.za;

    ssl_certificate /etc/letsencrypt/live/portal.emsmca.co.za/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/portal.emsmca.co.za/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/snippets/security-headers.conf;

    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://ems_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
        client_max_body_size 50M;
    }

    # Must precede `location /api/`: nginx picks the longest matching prefix,
    # so this wins for /api/crashes while everything else still uses api_limit.
    location /api/crashes {
        limit_req zone=crash_limit burst=5 nodelay;
        proxy_pass http://ems_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # ── Credential endpoints: strict per-IP budget ─────────────────────────
    #
    # `auth_limit` used to cover /api/auth/login ONLY. The endpoints below also
    # verify a password or mint a session token, and they were sitting in the
    # ordinary 10r/s api_limit:
    #
    #   /api/crew/portal-unlock                  the SHARED company password
    #   /api/providers/{slug}/portal-login       the same shared password
    #   /api/crew/lookup-hpcsa                   mints a 12h patient-record token
    #   /api/crew/shift-start-by-id              mints a 12h patient-record token
    #
    # Kept in step with _AUTH_EXACT / _AUTH_PATTERN in
    # backend/app/middleware/rate_limit.py — the application limiter fails OPEN
    # when Redis is down, so this layer is what remains under exactly the
    # condition that removes the other one.
    location = /api/auth/login {
        limit_req zone=auth_limit burst=50 nodelay;
        proxy_pass http://ems_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /api/auth/refresh {
        limit_req zone=auth_limit burst=50 nodelay;
        proxy_pass http://ems_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Regex location: matches the crew credential endpoints AND the
    # parameterised provider portal login, which an exact prefix cannot express.
    location ~ ^/api/(crew/(login|portal-unlock|lookup-hpcsa|shift-start-by-id)|providers/[^/]+/portal-login)$ {
        limit_req zone=auth_limit burst=50 nodelay;
        proxy_pass http://ems_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /docs {
        # Deny all external access to Swagger docs in production
        deny all;
    }

    location /openapi.json {
        deny all;
    }

    # The mock scheme server is no longer mounted when APP_ENV=production, but
    # deny it at the edge too — a future APP_ENV slip must not put fake OAuth
    # tokens and auto-approved authorisations on the public API.
    location /api/mock-scheme {
        deny all;
    }

    # Prometheus scrape endpoint. Unauthenticated by design, but it reports PRF
    # volumes and failure counts — the same shape of data /api/stats was closed
    # to anonymous callers. Prometheus runs inside the Docker network and
    # reaches the backend directly, so nothing legitimate needs it from outside.
    location /api/metrics {
        deny all;
    }

    location /health {
        proxy_pass http://ems_api;
        # REQUIRED. Every other proxied location sets this; /health did not, and
        # nginx's default for proxy_pass is `Host: $proxy_host` — i.e. the
        # literal upstream name `ems_api`. Once TrustedHostMiddleware was
        # enabled on the backend that Host is not in the allow-list, so the
        # public health endpoint started answering 400 "Invalid host header"
        # while the container's own healthcheck (which talks to localhost) still
        # passed — the failure mode most likely to be missed.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # ── Uploaded files (provider logos, etc.) ──
    # The backend writes logos to its upload volume and serves them via its
    # StaticFiles("/uploads") mount; nginx has no access to that volume, so we
    # proxy through. `^~` is REQUIRED: without it the ".png/.jpg/..." regex
    # location below matches first and serves from the frontend static root,
    # which 404s and shows a broken logo image.
    location ^~ /uploads/ {
        proxy_pass http://ems_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
        # ONE Cache-Control header. `expires 30d` emits its own
        # `Cache-Control: max-age=2592000`, and `add_header` then appends a
        # second `Cache-Control: public` — RFC-legal (they combine) but two
        # headers on the wire. Fold both into a single directive; the only thing
        # lost is the redundant legacy `Expires` header, which modern clients
        # ignore in favour of max-age.
        add_header Cache-Control "public, max-age=2592000";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?|ttf|eot)$ {
        access_log off;
        # ONE Cache-Control header (was `expires 1y` + `add_header` = two).
        # max-age=31536000 == 1y; keeps public + immutable.
        add_header Cache-Control "public, immutable, max-age=31536000";
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain text/css
        application/json application/javascript
        text/xml application/xml
        image/svg+xml;
}
