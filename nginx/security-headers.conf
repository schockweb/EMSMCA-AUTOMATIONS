# Security headers — included by all server blocks
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-XSS-Protection "1; mode=block" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(self)" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
# script-src has NO 'unsafe-inline'. It was removed on 2026-08-03 together with
# the inline Google Maps loader that required it (now
# frontend/src/services/googleMapsLoader.ts). Do not add it back to make an
# inline snippet work — bundle the snippet instead. With 'unsafe-inline'
# present this policy permits any injected script, which is precisely the
# attack it is recorded in Security Fixes.md as compensating for.
#
# CSP note: maps.googleapis.com / maps.gstatic.com are required by the Google
# Maps Places Autocomplete loaded in index.html — removing them breaks address
# lookup in DocumentReview. worker-src blob: is needed by the PWA service worker.
# connect-src includes nominatim.openstreetmap.org — the Digital PRF form fetches
# it directly from the browser for GPS reverse-geocode and street-address search.
# Without it the CSP blocks the fetch and location capture silently fails in prod
# (works on localhost only because dev has no CSP).
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://maps.googleapis.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://maps.googleapis.com https://maps.gstatic.com; connect-src 'self' https://maps.googleapis.com https://nominatim.openstreetmap.org; worker-src 'self' blob:; frame-ancestors 'self'; base-uri 'self'; form-action 'self';" always;
