[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = session

# ── Collection is restricted to tests/ ON PURPOSE ──────────────────────────
# backend/ has ~12 root-level files named test_*.py (test_llama.py,
# test_premium.py, test_tariff.py, ...). They are not tests — they are ad-hoc
# probe scripts that call live third-party APIs and write to whatever database
# DATABASE_URL happens to point at. pytest's default collection picks them up
# purely because of the filename, so the documented `cd backend && pytest`
# would fire real LlamaParse/Mistral requests and touch a live database.
#
# testpaths confines collection to the real suite. It does NOT block an explicit
# `pytest test_llama.py`, which stays the correct escape hatch for deliberately
# running one probe.
testpaths = tests

# Belt and braces: never descend into these even if invoked from elsewhere.
norecursedirs = alembic uploads .venv venv __pycache__ node_modules
