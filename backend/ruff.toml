# Ruff configuration — deliberately a STARTER ruleset, not the full default.
#
# Context: CI had never passed once (355 runs, 355 failures) because `ruff check`
# ran with ruff's defaults against a codebase that had never been linted. It
# reported ~1,200 findings, the lint job failed, and `test-backend` declared
# `needs: lint` — so the backend tests and the image build had literally never
# executed on any commit. A permanently red X carries no information, and nobody
# investigates it.
#
# The fix is to gate on rules that catch REAL defects, and leave stylistic
# modernisation as a separate, opt-in cleanup. Tighten this over time; do not
# turn everything on at once and recreate the red-X problem.

target-version = "py312"
line-length = 120

[lint]
# F = pyflakes (undefined names, unused imports, redefinitions — real bugs)
# E9 = syntax/IO errors that stop the file being parsed at all
select = ["F", "E9"]

ignore = [
  # Unused imports are usually harmless and are everywhere in this codebase
  # (re-exports, conditional imports). Worth a dedicated cleanup, not a gate.
  "F401",
  # Locally re-imported names inside functions — intentional in several async
  # paths to keep module import cost down. Not a defect.
  "F811",
  # Assigned-but-unused locals. The five current instances are all inside
  # DORMANT subsystems (tariff_engine + ocr_extraction are switched off via
  # TARIFF_ENGINE_ENABLED / OCR_INTAKE_ENABLED, and the digital_prf one sits in
  # the parked adjudication scrub). Deleting them would throw away context those
  # subsystems need when re-enabled, so they are documented rather than removed.
  # REVISIT when the tariff engine or OCR intake is turned back on — an unused
  # local there (e.g. `use_distance_billing`) may be a genuine logic gap.
  "F841",
]

[lint.per-file-ignores]
# Alembic revisions are generated; they carry unused imports by design.
"alembic/versions/*.py" = ["F"]
# Ad-hoc probes and one-off harnesses are not production code.
"scripts/**/*.py" = ["F"]

[format]
# Formatting is not enforced yet — enabling it would rewrite the whole codebase
# in one commit and bury real changes in noise.
quote-style = "preserve"
