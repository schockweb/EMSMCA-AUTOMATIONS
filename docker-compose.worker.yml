# ═══════════════════════════════════════════════════════════
# EMS Claims Portal — Worker Server Compose
# ═══════════════════════════════════════════════════════════
# Deploys to: Azure VM (ems-portal-vm) — same VM as app services
# Services:  RabbitMQ, Celery workers, Flower monitoring
#
# ems_shared_net bridges the worker and app compose files so the
# backend can reach RabbitMQ by container name (ems_rabbitmq)
# instead of relying on the docker0 bridge IP.
#
# Usage:
#   docker compose -f docker-compose.worker.yml up -d --build
#   docker compose -f docker-compose.worker.yml logs -f
# ═══════════════════════════════════════════════════════════

# Cap container logs. Docker's json-file driver is unbounded by default:
# a crash-looping container (ems_flower did 2659 restarts) or an exception
# storm can fill the disk in hours, which breaks everything at once.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "5"

services:
  # ── RabbitMQ Message Broker ─────────────────────────────
  # Handles Celery task queues (OCR, adjudication, email, etc.)
  # Port 5672: AMQP (internal only — not exposed to host)
  # Port 15672: Management UI (localhost only, SSH tunnel access)
  ems_rabbitmq:
    logging: *default-logging
    image: rabbitmq:3.13-management-alpine
    container_name: ems_rabbitmq
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
    hostname: ems-rabbitmq             # Fixed hostname for persistent queue data
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS}
      # Durable queues & dead-letter exchange for failed tasks
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: >-
        -rabbit log [{console,[{level,warning}]}]
    env_file:
      - .env.prod
    ports:
      - "127.0.0.1:5672:5672"          # AMQP — firewalled, only app servers allowed
      - "127.0.0.1:15672:15672"        # Management UI — localhost only (SSH tunnel)
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 15s
      timeout: 10s
      start_period: 30s
      retries: 5
    networks:
      - ems_worker_net
      - ems_shared_net

  # ── Celery Worker ───────────────────────────────────────
  # Processes async tasks: OCR parsing, claims adjudication,
  # email notifications, report generation.
  # - prefork pool for CPU-bound OCR work
  # - 12 concurrent workers (CX42 has 8 vCPU, allow oversubscription
  #   since many tasks are I/O-bound API calls)
  # NOTE on two settings below that were changed on 2026-08-03:
  #
  # --without-heartbeat was REMOVED. With AMQP heartbeats off, a half-open TCP
  # connection — an Azure idle timeout, a broker restart — is never detected by
  # the worker. The container stays up, /health stays green (it reads the
  # consumer count but derives its verdict from queue DEPTH alone), and the
  # queue quietly drains to zero consumers while patient report forms stop being
  # processed. Heartbeats are what turn that silent failure into a reconnect.
  #
  # ems_batch was ADDED to -Q. celery_app.py declares the queue and production
  # consumed ems_default and ems_critical only, so anything routed to ems_batch
  # would have gone to a queue nothing reads — a black hole with no error
  # anywhere. Nothing routes there today; this closes it before something does.
  ems_celery_worker:
    logging: *default-logging
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: ems_celery_worker
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '3.0'
          memory: 4G
    env_file:
      - .env.prod
    volumes:
      - upload_data:/app/uploads       # Shared upload storage
      - worker_logs:/app/logs          # Worker-specific logs
    depends_on:
      ems_rabbitmq:
        condition: service_healthy
    command: >
      celery -A app.tasks.celery_app worker
      --loglevel=info
      --pool=prefork
      --concurrency=12
      --max-tasks-per-child=1000
      -Q ems_default,ems_critical,ems_batch,default,ocr,adjudication,notifications
    networks:
      - ems_worker_net
      - ems_shared_net

  # ── Celery Beat — Periodic Task Scheduler ───────────────
  # Fires the scheduled tasks defined in celery_app.py beat_schedule —
  # currently the stuck-PRF watchdog (requeue_stuck_prfs, every 5 min),
  # which rescues submissions whose queue message was lost so they can't
  # sit invisibly at SUBMITTED forever. Beat only *publishes* due tasks
  # (the worker executes them), so it needs the broker but not the DB.
  # Exactly ONE beat instance must ever run — it's a scheduler, not a worker.
  ems_celery_beat:
    logging: *default-logging
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: ems_celery_beat
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
    env_file:
      - .env.prod
    depends_on:
      ems_rabbitmq:
        condition: service_healthy
    # Schedule file lives in the container's /tmp — world-writable, so it works
    # under the image's non-root user (a named volume here is root-owned and
    # crashed beat with EACCES). Losing it on restart is harmless: the only
    # entry is the idempotent 5-min watchdog, which simply re-fires within one
    # interval.
    command: >
      celery -A app.tasks.celery_app beat
      --loglevel=info
      --schedule=/tmp/celerybeat-schedule
    healthcheck:
      # The image's inherited healthcheck probes a celery *worker*; beat is a
      # scheduler and would show permanently unhealthy. Disable (dev does too).
      disable: true
    networks:
      - ems_worker_net
  # ── Flower (Celery monitoring UI) — REMOVED 2026-07-27 ──
  # The image never had the `flower` package installed, so the container
  # crash-looped 2659 times ('No such command flower') while appearing to be
  # a running service. It was stopped by hand twice and resurrected both times
  # by a routine `compose up`, because the service definition still existed.
  # Deleted rather than left broken. To reinstate: add `flower` to
  # backend/requirements.txt, rebuild, and restore this service block.


# ── Volumes ───────────────────────────────────────────────
volumes:
  rabbitmq_data:
    driver: local
  upload_data:
    driver: local
  worker_logs:
    driver: local

# ── Networks ──────────────────────────────────────────────
# ems_worker_net:  Internal bridge for RabbitMQ ↔ Workers.
# ems_shared_net:  Shared with docker-compose.prod.yml (external).
#                  Created by the prod compose; worker compose joins it.
networks:
  ems_worker_net:
    driver: bridge
  ems_shared_net:
    external: true
