# ═══════════════════════════════════════════════════════════════════════════
# EMS Claims Portal — Continuous Integration
#
# HISTORY / WHY THIS IS SHAPED THIS WAY
# -------------------------------------
# This pipeline failed 355 times out of 355 runs between 2026-05 and 2026-07 —
# it had never once passed. The cause was structural, not flaky:
#   * `ruff check` ran with ruff's defaults over a never-linted codebase and
#     reported ~1,200 findings, so the lint job always failed;
#   * `test-backend` declared `needs: lint`, and `build-images` needed that —
#     so the backend tests and the image builds LITERALLY NEVER EXECUTED;
#   * pytest ran with `-x`, and one UTF-16 file in tests/ aborted collection;
#   * the 218-test frontend suite (the PRF/PDF regression gate) was not
#     referenced anywhere at all.
# A permanently red X carries no information, and nobody investigates it.
#
# The fixes: test jobs no longer depend on lint (a style opinion must never
# block a correctness signal), ruff gates on a starter real-defect ruleset
# (backend/ruff.toml), the Azure probe scripts moved out of tests/, and the
# frontend suite is now a first-class job.
# ═══════════════════════════════════════════════════════════════════════════

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ═══════════════════════════════════════════════════════════════════════
  # Frontend tests — the PRF/PDF regression gate.
  # Deliberately has NO `needs:`. This suite is what stops a captured field
  # silently disappearing from the PDF sent to a medical scheme, so nothing
  # else in the pipeline may prevent it from running.
  # ═══════════════════════════════════════════════════════════════════════
  test-frontend:
    name: "Frontend Tests (vitest)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: cd frontend && npm ci --no-audit

      - name: Run vitest
        run: cd frontend && npx vitest run

      # Guards the failure mode this repo has actually hit: a suite that dies at
      # import collects 0 tests and still reports green.
      - name: Assert the suite actually collected tests
        run: |
          cd frontend
          npx vitest run --reporter=json --outputFile=vitest-out.json >/dev/null 2>&1 || true
          COUNT=$(node -e "try{console.log(require('./vitest-out.json').numTotalTests||0)}catch(e){console.log(0)}")
          echo "collected tests: $COUNT"
          if [ "$COUNT" -lt 150 ]; then
            echo "::error::Only $COUNT tests collected — expected 150+. A suite probably failed to import."
            exit 1
          fi

  # ═══════════════════════════════════════════════════════════════════════
  # Backend tests — pytest against a real PostgreSQL.
  # No `needs: lint` — that gate is what kept this from ever running.
  # ═══════════════════════════════════════════════════════════════════════
  test-backend:
    name: "Backend Tests (pytest)"
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
          POSTGRES_DB: test_ems
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_user"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: "postgresql+asyncpg://test_user:test_pass@localhost:5432/test_ems"
      SECRET_KEY: "test-secret"
      ENCRYPTION_KEY: "test-encrypt-key-32chars0000000"
      CELERY_BROKER_URL: "memory://"
      APP_ENV: "development"
      SEED_ADMIN_PASSWORD: "DevSeed!Change#2026"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install backend dependencies
        run: |
          cd backend
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx

      - name: Wait for PostgreSQL
        run: |
          until pg_isready -h localhost -p 5432 -U test_user; do
            echo "Waiting for Postgres..."
            sleep 2
          done

      # No `-x`: one failure must not hide the state of every other test.
      - name: Run pytest
        run: cd backend && python -m pytest tests/ -v --tb=short

  # ═══════════════════════════════════════════════════════════════════════
  # Lint — a quality signal that never gates the test jobs above.
  # ═══════════════════════════════════════════════════════════════════════
  lint:
    name: "Lint"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Ruff
        run: pip install ruff

      # Gates on backend/ruff.toml — real-defect rules only (F, E9).
      - name: Ruff check (backend)
        run: cd backend && ruff check app/ --output-format=github

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: cd frontend && npm ci --no-audit

      - name: TypeScript type-check
        run: cd frontend && npx tsc --noEmit

      # ESLint is reported but not yet enforced: the codebase carries ~120
      # findings (mostly no-explicit-any) and failing on them today would
      # recreate the always-red pipeline this file exists to fix.
      # `continue-on-error` surfaces the result honestly — unlike the previous
      # `|| true`, which hid it entirely. Remove once the backlog is cleared.
      - name: ESLint (reported, not yet enforced)
        continue-on-error: true
        run: cd frontend && npx eslint src/

  # ═══════════════════════════════════════════════════════════════════════
  # Images must build — gated on both test suites, not on lint.
  # ═══════════════════════════════════════════════════════════════════════
  build-images:
    name: "Build Docker Images"
    runs-on: ubuntu-latest
    needs: [test-frontend, test-backend]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Builds the PRODUCTION Dockerfiles — the ones docker-compose.prod.yml
      # actually deploys. The previous config pointed at the dev Dockerfiles
      # while naming stages from the prod ones ("serve" does not exist in
      # frontend/Dockerfile), so this job could never have succeeded even had it
      # ever been reached. Verifying the deployed image is also the more useful
      # check: a broken prod build now fails here instead of on the VM.
      - name: Build backend image (production)
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile.prod
          push: false
          target: runtime
          tags: ems-backend:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image (production)
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile.prod
          push: false
          target: serve
          tags: ems-frontend:ci-${{ github.sha }}
          build-args: |
            VITE_API_URL=/api
            VITE_GOOGLE_MAPS_KEY=ci-placeholder
          cache-from: type=gha
          cache-to: type=gha,mode=max
