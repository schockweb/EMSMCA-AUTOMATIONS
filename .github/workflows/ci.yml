# ═══════════════════════════════════════════════════════════════════════════
# EMS Claims Portal — Continuous Integration
#
# HISTORY / WHY THIS IS SHAPED THIS WAY
# -------------------------------------
# This pipeline failed 355 times out of 355 runs between 2026-05 and 2026-07 —
# it had never once passed. The cause was structural, not flaky:
#   * `ruff check` ran with ruff's defaults over a never-linted codebase and
#     reported ~1,200 findings, so the lint job always failed;
#   * `test-backend` declared `needs: lint`, and `build-images` needed that —
#     so the backend tests and the image builds LITERALLY NEVER EXECUTED;
#   * pytest ran with `-x`, and one UTF-16 file in tests/ aborted collection;
#   * the 218-test frontend suite (the PRF/PDF regression gate) was not
#     referenced anywhere at all.
# A permanently red X carries no information, and nobody investigates it.
#
# The fixes: test jobs no longer depend on lint (a style opinion must never
# block a correctness signal), ruff gates on a starter real-defect ruleset
# (backend/ruff.toml), the Azure probe scripts moved out of tests/, and the
# frontend suite is now a first-class job.
# ═══════════════════════════════════════════════════════════════════════════

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ═══════════════════════════════════════════════════════════════════════
  # Frontend tests — the PRF/PDF regression gate.
  # Deliberately has NO `needs:`. This suite is what stops a captured field
  # silently disappearing from the PDF sent to a medical scheme, so nothing
  # else in the pipeline may prevent it from running.
  # ═══════════════════════════════════════════════════════════════════════
  test-frontend:
    name: "Frontend Tests (vitest)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: cd frontend && npm ci --no-audit

      - name: Run vitest
        run: cd frontend && npx vitest run

      # Guards the failure mode this repo has actually hit: a suite that dies at
      # import collects 0 tests and still reports green.
      - name: Assert the suite actually collected tests
        run: |
          cd frontend
          npx vitest run --reporter=json --outputFile=vitest-out.json >/dev/null 2>&1 || true
          COUNT=$(node -e "try{console.log(require('./vitest-out.json').numTotalTests||0)}catch(e){console.log(0)}")
          echo "collected tests: $COUNT"
          if [ "$COUNT" -lt 150 ]; then
            echo "::error::Only $COUNT tests collected — expected 150+. A suite probably failed to import."
            exit 1
          fi

  # ═══════════════════════════════════════════════════════════════════════
  # Backend tests — pytest against a real PostgreSQL.
  # No `needs: lint` — that gate is what kept this from ever running.
  # ═══════════════════════════════════════════════════════════════════════
  test-backend:
    name: "Backend Tests (pytest)"
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
          POSTGRES_DB: test_ems
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_user"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      # A REAL broker, not memory://.
      #
      # The 2026-08-01 submit outage was a queue declared with the wrong
      # dead-letter arguments — RabbitMQ answered 406 PRECONDITION_FAILED and
      # no crew could submit a PRF. An in-memory transport accepts anything, so
      # CI was structurally incapable of seeing it. See
      # tests/test_broker_queue_declare.py.
      rabbitmq:
        image: rabbitmq:3.13-alpine
        env:
          RABBITMQ_DEFAULT_USER: test_rabbit
          RABBITMQ_DEFAULT_PASS: test_rabbit_pass
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: "postgresql+asyncpg://test_user:test_pass@localhost:5432/test_ems"
      SECRET_KEY: "test-secret"
      ENCRYPTION_KEY: "test-encrypt-key-32chars0000000"
      CELERY_BROKER_URL: "amqp://test_rabbit:test_rabbit_pass@localhost:5672//"
      # Under this flag an absent or unreachable broker FAILS the build instead
      # of skipping. A suite that quietly skips its only real-broker test looks
      # identical to one that passes it.
      EMS_TESTS_REQUIRE_BROKER: "1"
      APP_ENV: "development"
      SEED_ADMIN_PASSWORD: "DevSeed!Change#2026"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install backend dependencies
        run: |
          cd backend
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx

      - name: Wait for PostgreSQL
        run: |
          until pg_isready -h localhost -p 5432 -U test_user; do
            echo "Waiting for Postgres..."
            sleep 2
          done

      - name: Wait for RabbitMQ
        run: |
          for i in $(seq 1 30); do
            if (echo > /dev/tcp/localhost/5672) 2>/dev/null; then
              echo "RabbitMQ accepting connections"; exit 0
            fi
            echo "Waiting for RabbitMQ... ($i/30)"; sleep 2
          done
          echo "::error::RabbitMQ never came up — the broker tests would skip silently"
          exit 1

      # No `-x`: one failure must not hide the state of every other test.
      - name: Run pytest
        run: cd backend && python -m pytest tests/ -v --tb=short

  # ═══════════════════════════════════════════════════════════════════════
  # Lint — a quality signal that never gates the test jobs above.
  # ═══════════════════════════════════════════════════════════════════════
  lint:
    name: "Lint"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Ruff
        run: pip install ruff

      # Gates on backend/ruff.toml — real-defect rules only (F, E9).
      - name: Ruff check (backend)
        run: cd backend && ruff check app/ --output-format=github

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: cd frontend && npm ci --no-audit

      - name: TypeScript type-check
        run: cd frontend && npx tsc --noEmit

      # ESLint is reported but not yet enforced: the codebase carries ~120
      # findings (mostly no-explicit-any) and failing on them today would
      # recreate the always-red pipeline this file exists to fix.
      # `continue-on-error` surfaces the result honestly — unlike the previous
      # `|| true`, which hid it entirely. Remove once the backlog is cleared.
      - name: ESLint (reported, not yet enforced)
        continue-on-error: true
        run: cd frontend && npx eslint src/

  # ═══════════════════════════════════════════════════════════════════════
  # Dependency vulnerabilities.
  #
  # This had never run. On 2026-07-31 a first manual scan found 53 advisories
  # across 9 backend packages — including the JWT library (algorithm confusion),
  # the ASGI layer under FastAPI, the multipart parser handling every upload,
  # and Pillow, which decodes attacker-supplied images. None of it was visible
  # because nothing looked. For a platform holding patient data, "nobody ran a
  # scanner" is not an acceptable answer, so it now runs on every push.
  #
  # PRODUCTION dependencies GATE the build. Build-only dependencies (eslint,
  # the workbox/PWA toolchain) are reported but do not fail CI: they never reach
  # a running system, and several of their advisories currently have no fixed
  # release at all — npm's suggested "fix" for vite-plugin-pwa is a DOWNGRADE,
  # which would put the crew offline service worker at risk to silence a
  # build-time finding. Report those honestly rather than pretending or forcing.
  # ═══════════════════════════════════════════════════════════════════════
  dependency-audit:
    name: "Dependency Audit"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install pip-audit
        run: pip install pip-audit

      # Gating. The one known exception is ecdsa PYSEC-2026-1325, a timing
      # side-channel in ECDSA signing that upstream has no fix for. We sign with
      # HS256 (HMAC) and never perform an ECDSA operation, so the vulnerable
      # code path is unreachable; ecdsa is only present because
      # python-jose[cryptography] declares it.
      - name: pip-audit (backend, gating)
        run: |
          cd backend
          pip-audit -r requirements.txt --progress-spinner off \
            --ignore-vuln PYSEC-2026-1325

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: cd frontend && npm ci --no-audit

      # Gating: anything that actually ships to a browser.
      - name: npm audit (production deps, gating)
        run: cd frontend && npm audit --omit=dev --audit-level=high

      - name: npm audit (build-time deps, reported only)
        continue-on-error: true
        run: cd frontend && npm audit --audit-level=high

  # ═══════════════════════════════════════════════════════════════════════
  # Images must build — gated on both test suites, not on lint.
  # ═══════════════════════════════════════════════════════════════════════
  build-images:
    name: "Build Docker Images"
    runs-on: ubuntu-latest
    needs: [test-frontend, test-backend]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Builds the PRODUCTION Dockerfiles — the ones docker-compose.prod.yml
      # actually deploys. The previous config pointed at the dev Dockerfiles
      # while naming stages from the prod ones ("serve" does not exist in
      # frontend/Dockerfile), so this job could never have succeeded even had it
      # ever been reached. Verifying the deployed image is also the more useful
      # check: a broken prod build now fails here instead of on the VM.
      - name: Build backend image (production)
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile.prod
          push: false
          target: runtime
          tags: ems-backend:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image (production)
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile.prod
          push: false
          target: serve
          tags: ems-frontend:ci-${{ github.sha }}
          build-args: |
            VITE_API_URL=/api
            VITE_GOOGLE_MAPS_KEY=ci-placeholder
          cache-from: type=gha
          cache-to: type=gha,mode=max
