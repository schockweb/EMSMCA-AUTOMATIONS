# ═══════════════════════════════════════════════════════════════════════════
# EMS Claims Portal — Production Deployment
# Single Azure VM: ems-portal-vm (172.209.218.22)
# Domain: portal.emsmca.co.za
#
# Trigger:
#   - Automatically after CI passes on main
#   - Manual dispatch via GitHub UI
#
# Required GitHub Secrets:
#   SSH_PRIVATE_KEY   — deploy key (ed25519 recommended)
#   DEPLOY_HOST       — IP of the Azure VM (e.g. 172.209.218.22)
#   VITE_GOOGLE_MAPS_KEY — Google Maps API key (injected at build time)
# ═══════════════════════════════════════════════════════════════════════════

name: Deploy

on:
  # Auto-deploy on push is DISABLED. Deploys are done MANUALLY via SSH per
  # deploy/GO-LIVE-RUNBOOK.md — the pipeline's git-reset-hard + wrong DEPLOY_DIR
  # was a foot-gun that could clobber the VM. Re-enable this block only once the
  # pipeline is fully fixed and tested.
  # workflow_run:
  #   workflows: ["CI"]
  #   types: [completed]
  #   branches: [main]

  # Manual trigger from the GitHub UI only
  workflow_dispatch:
    inputs:
      skip_health_check:
        description: "Skip health checks (emergency deploy)"
        required: false
        default: "false"

concurrency:
  group: deploy-production
  cancel-in-progress: false          # never cancel an in-flight deploy

env:
  DEPLOY_USER: deploy
  DEPLOY_DIR: /opt/ems

jobs:
  # ═══════════════════════════════════════════════════════════════════════
  # Gate: only proceed if CI succeeded (for workflow_run trigger)
  # ═══════════════════════════════════════════════════════════════════════
  check-ci:
    name: "Verify CI Passed"
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - run: echo "✅ CI passed — proceeding with deploy"

  # ═══════════════════════════════════════════════════════════════════════
  # Deploy: app server + worker on the single Azure VM
  # ═══════════════════════════════════════════════════════════════════════
  deploy:
    name: "Deploy to Azure VM"
    runs-on: ubuntu-latest
    needs: check-ci
    environment: production

    steps:
      - name: Deploy app + worker
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ env.DEPLOY_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 15m
          script: |
            set -euo pipefail
            echo "═══ Deploying EMS Portal to Azure VM ═══"

            cd ${{ env.DEPLOY_DIR }}

            # Name the release currently serving traffic BEFORE overwriting it.
            # `up -d --build` replaces :latest in place, so after this point the
            # previous version has no tag and going back means a full rebuild.
            bash deploy/ops/tag-release.sh || echo "WARN: could not tag the outgoing release"

            # Pull latest code
            git fetch origin main
            git reset --hard origin/main

            # ── App services (backend + nginx) ──────────────────────────
            # NOTE: --remove-orphans is deliberately NOT used here. See below.
            VITE_GOOGLE_MAPS_KEY="${{ secrets.VITE_GOOGLE_MAPS_KEY }}" \
              docker compose -f docker-compose.prod.yml up -d --build

            # Run database migrations — only after backend is healthy
            docker compose -f docker-compose.prod.yml exec -T ems_backend \
              python -m alembic upgrade head

            # ── Worker services (RabbitMQ + Celery + Flower) ────────────
            # ⚠ NEVER add --remove-orphans to either compose command.
            # Neither compose file declares `name:`, so both resolve to the SAME
            # project ("ems", from the directory). --remove-orphans deletes every
            # container in the project that the current file does not define, so
            # the sequence would be:
            #   prod.yml   --remove-orphans → deletes rabbitmq, worker, beat, flower
            #   worker.yml --remove-orphans → deletes backend, nginx, redis, certbot
            # and the deploy would END with the entire application deleted and not
            # recreated. This never fired only because auto-deploy has been broken.
            #
            # Giving each file its own project name is NOT the fix: volumes are
            # declared without an explicit `name:` (upload_data, backend_logs, ...),
            # so they are project-prefixed. Renaming the project would orphan
            # ems_upload_data and every PRF attachment in it.
            docker compose -f docker-compose.worker.yml up -d --build

            # Rebuilding worker services recreates the shared network, which can
            # reassign the backend's IP. nginx resolves its upstream once at
            # startup and caches it, so it keeps proxying to the old address and
            # every request 502s while `docker ps` shows everything healthy.
            # Reloading nginx last re-resolves the upstream. (Cost: one reload.)
            docker restart ems_nginx

            # Prune dangling images to save disk. NOT -a: the release-* tags are
            # the rollback path, and `prune -a` would delete every one of them.
            docker image prune -f

            # Tag what we just deployed, so the NEXT deploy has a way back.
            bash deploy/ops/tag-release.sh || echo "WARN: could not tag the new release"

            echo "✅ Deploy complete"

      - name: Health check
        if: inputs.skip_health_check != 'true'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ env.DEPLOY_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -euo pipefail
            echo "⏳ Waiting for services to become healthy..."

            # Retry health check up to 30 times (60 seconds)
            for i in $(seq 1 30); do
              HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost/health || true)
              if [ "$HTTP_CODE" = "200" ]; then
                echo "✅ API healthy (attempt $i)"
                break
              fi
              echo "  attempt $i: HTTP $HTTP_CODE — retrying in 2s"
              sleep 2
              if [ "$i" -eq 30 ]; then
                echo "❌ Health check failed after 60s"
                docker compose -f /opt/ems-claims/docker-compose.prod.yml logs --tail=50 ems_backend
                exit 1
              fi
            done

            # Verify Celery workers registered with RabbitMQ
            sleep 5
            RUNNING=$(docker compose -f /opt/ems-claims/docker-compose.worker.yml ps --status running --format json 2>/dev/null | grep -c "ems_celery" || true)
            if [ "$RUNNING" -ge 1 ]; then
              echo "✅ Celery workers running ($RUNNING container(s))"
            else
              echo "⚠️  No Celery workers detected — check logs"
              docker compose -f /opt/ems-claims/docker-compose.worker.yml logs --tail=30 ems_celery_worker
            fi

  # ═══════════════════════════════════════════════════════════════════════
  # Post-deploy notification
  # ═══════════════════════════════════════════════════════════════════════
  notify:
    name: "Notify"
    runs-on: ubuntu-latest
    needs: [deploy]
    if: always()

    steps:
      - name: Deployment summary
        run: |
          if [ "${{ needs.deploy.result }}" = "success" ]; then
            echo "🚀 EMS Portal deployed successfully to portal.emsmca.co.za"
          else
            echo "⚠️  Deployment failed — result: ${{ needs.deploy.result }}"
            exit 1
          fi
