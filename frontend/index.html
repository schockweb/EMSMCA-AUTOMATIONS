<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/ems-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Digital PRF" />
    <link rel="apple-touch-icon" href="/ems-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="EMS Medical Claims Ingestion Portal — AI-powered claims processing for South African Emergency Medical Services" />
    <title>EMS Claims Portal | AI-Powered Medical Claims</title>
    <!-- Google Maps JavaScript API — key injected at build time via VITE_GOOGLE_MAPS_KEY -->
    <script>
      (function() {
        var key = '%VITE_GOOGLE_MAPS_KEY%';
        if (key && key !== '%VITE_GOOGLE_MAPS_KEY%') {
          var s = document.createElement('script');
          s.src = 'https://maps.googleapis.com/maps/api/js?key=' + key + '&libraries=places&loading=async';
          s.async = true;
          s.defer = true;
          document.head.appendChild(s);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
