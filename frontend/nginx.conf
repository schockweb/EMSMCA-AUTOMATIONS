# Frontend Nginx config — SPA routing + security headers
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 50M;

    # ── Docker internal DNS resolver ──────────────────────────
    # 127.0.0.11 is Docker's embedded DNS server. Using a variable
    # for proxy_pass forces Nginx to re-resolve the hostname on every
    # request (not just at startup), so the backend container can be
    # rebuilt or restarted without needing a frontend restart.
    resolver 127.0.0.11 valid=5s ipv6=off;
    set $backend_upstream http://backend:8000;

    # ── Security Headers ──
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Mirrors the production edge (nginx/security-headers.conf): the SPA and API
    # are one origin, so refuse cross-origin no-cors loads of these responses.
    # Kept here so local dev does not drift from prod on this header.
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    # self, NOT () — these three are core crew features, not optional extras.
    # An empty allowlist disables the API for EVERY origin including our own, so
    # this line switched off hold-to-talk dictation, the medical-aid card photo
    # and incident-scene GPS capture. The production edge
    # (nginx/security-headers.conf) has always used `self`; this file drifted.
    add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(self)" always;

    # ── API Proxy → FastAPI backend ──
    location /api/ {
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
    }

    # ── Uploads Proxy → FastAPI backend ──
    # The ^~ modifier gives this block priority over the static asset regex below
    location ^~ /uploads/ {
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ── SPA fallback ──
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Static asset caching ──
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?|ttf|eot)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    # ── Gzip ──
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain text/css
        application/json application/javascript
        text/xml application/xml
        image/svg+xml;
}
